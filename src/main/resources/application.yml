# ================= 主配置：激活环境 =================
spring:
  application:
    name: pet-community
  profiles:
    active: dev   # 开发环境使用 dev，生产切换 prod
  # MyBatis 全局配置
mybatis:
  configuration:
    map-underscore-to-camel-case: true   # 下划线转驼峰
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.itheima.entity

# ================= 业务自定义配置 =================
pet:
  jwt:
    # JWT 签名密钥（生产环境请更换并保密）
    secret: pet-community-jwt-secret-2026
    # token 有效期（小时）
    expire-hours: 72
    # Redis 中登录 token 的键前缀，键结构：login:token:{token} -> userId
    token-key: "login:token:"
  upload:
    # 图片本地存储目录：项目内 upload/images（沙箱/权限友好，可自行改为其他盘符路径）
    # 预留对象存储扩展，见 FileStorageService
    dir: D:/MYsuo/study/jdk21,idea2026/web-springboot01/upload/images
    # 允许上传的图片格式
    allow-types: jpg,jpeg,png,gif,webp
    # 单文件最大 10MB
    max-size: 10485760
    # 对象存储类型扩展点：local | aliyun | tencent
    oss-type: local
  sensitive:
    # 基础敏感词（逗号分隔，可自行扩充）
    words: 赌博,诈骗,代充,外挂,枪支,毒品
