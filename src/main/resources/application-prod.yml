# ================= 生产环境配置（占位，按实际部署修改） =================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pet_community?useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: 192.168.100.128   # 虚拟机 Redis（禁止 localhost）
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 1             # db1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080

logging:
  level:
    com.itheima.mapper: warn
    root: info
